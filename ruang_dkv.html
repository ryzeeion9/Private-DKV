<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>Ruang DKV</title>
<style>
:root{--bg:#f5f5fb;--panel:#fff;--panel2:#f0efff;--text:#24233a;--muted:#77758f;--line:#e8e6f3;--accent:#6d5dfc;--accent2:#8d80ff;--good:#26a879;--danger:#e45d75;--shadow:0 12px 34px #25204b0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}
body.dark{--bg:#14141c;--panel:#1e1e29;--panel2:#29263d;--text:#f0efff;--muted:#aaa7c1;--line:#343343;--accent:#9387ff;--accent2:#b1a8ff;--shadow:0 12px 34px #0003}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{min-height:100vh}.topbar{height:68px;display:flex;align-items:center;gap:13px;padding:0 18px;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.iconbtn{border:0;background:transparent;color:var(--text);font-size:24px;width:40px;height:40px;border-radius:12px}.iconbtn:hover{background:var(--panel2)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.5px;font-size:18px}.brandmark{width:35px;height:35px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#b3aaff);color:white;border-radius:12px;font-weight:900}
.topspacer{flex:1}.datepill{color:var(--muted);font-size:12px}
.shell{max-width:1200px;margin:auto;padding:22px 18px 60px}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.7px;color:var(--accent);font-weight:800}.pagehead h1{font-size:clamp(25px,4vw,34px);line-height:1.15;margin:5px 0 5px;letter-spacing:-1px}.sub{color:var(--muted);margin:0;font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 5px 12px #6d5dfc24}.btn:hover{filter:brightness(1.06)}.btn.secondary{background:var(--panel2);color:var(--text);box-shadow:none;border:1px solid var(--line)}.btn.danger{background:#fff0f2;color:var(--danger);box-shadow:none}.btn.small{padding:7px 10px;font-size:12px;border-radius:9px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}.span12{grid-column:span 12}.span8{grid-column:span 8}.span7{grid-column:span 7}.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}
.profile{padding:0;overflow:hidden}.banner{height:150px;background:linear-gradient(125deg,#5547d9,#9d83ff 55%,#e5dfff);background-position:center;background-size:cover;position:relative}.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#18152b40,transparent 55%)}.profilebody{padding:0 20px 20px;position:relative}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:5px solid var(--panel);background:var(--panel2);margin-top:-48px;position:relative;z-index:2}.profileline{display:flex;align-items:flex-end;gap:15px}.profiletext{padding:8px 0 0;min-width:0;flex:1}.profilename{font-size:24px;font-weight:850;letter-spacing:-.7px;line-height:1.25;overflow-wrap:anywhere}.profilebio{color:var(--muted);font-size:13px;margin-top:3px;overflow-wrap:anywhere}.editprofile{align-self:center;margin-top:12px}
.sectiontitle{font-size:16px;font-weight:800;margin:0 0 14px;letter-spacing:-.25px;display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:var(--muted)}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{background:var(--panel2);padding:14px;border-radius:15px;min-width:0}.staticon{font-size:19px}.statnum{font-size:25px;font-weight:850;letter-spacing:-1px;margin-top:5px}.statlabel{font-size:11px;color:var(--muted);line-height:1.35}.progress{height:7px;border-radius:20px;background:var(--line);overflow:hidden;margin-top:12px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:20px}
.list{display:flex;flex-direction:column;gap:9px}.listitem{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;min-width:0}.listmain{min-width:0;flex:1}.listtitle{font-weight:750;overflow-wrap:anywhere}.listmeta{font-size:12px;color:var(--muted);margin-top:2px}.dot{width:9px;height:9px;background:var(--accent);border-radius:50%;flex-shrink:0}.empty{padding:25px 12px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:14px}
.daytabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:15px}.daytab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 13px;border-radius:11px;white-space:nowrap;font-weight:700;font-size:12px}.daytab.active{background:var(--accent);border-color:var(--accent);color:white}
.event{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.eventtime{width:92px;flex-shrink:0;color:var(--muted);font-size:12px;font-weight:700}.eventbody{border-left:3px solid var(--accent);padding-left:12px;min-width:0}.eventname{font-weight:800}.eventtag{font-size:11px;color:var(--muted);margin-top:3px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:750;color:var(--muted)}.field input,.field textarea,.field select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-width:0}.field textarea{resize:vertical;min-height:100px}.field input[type=file]{padding:9px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.search{flex:1;min-width:150px}.search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 12px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:8px;background:var(--panel2);color:var(--accent);font-size:10px;font-weight:800}.itemcard{border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}.itemtop{display:flex;gap:10px;align-items:flex-start}.itemtitle{font-weight:800;font-size:15px;overflow-wrap:anywhere;flex:1}.itembody{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:13px;margin:10px 0}.attachments{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.attachment{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 9px;font-size:12px;max-width:100%;overflow-wrap:anywhere;color:var(--text);text-decoration:none}.attachment img{width:100px;height:75px;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px}.itemactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.completed{opacity:.68}.completed .itemtitle{text-decoration:line-through}
.menuoverlay{position:fixed;inset:0;background:#100d2366;z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}.menuoverlay.show{opacity:1;pointer-events:auto}.drawer{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(310px,86vw);background:var(--panel);border-right:1px solid var(--line);padding:18px;transform:translateX(-105%);transition:transform .23s;display:flex;flex-direction:column;gap:7px}.drawer.show{transform:translateX(0)}.drawerhead{display:flex;align-items:center;justify-content:space-between;padding:4px 0 18px}.navbtn{border:0;background:transparent;color:var(--text);border-radius:12px;text-align:left;padding:12px;display:flex;align-items:center;gap:12px;font-weight:750}.navbtn.active,.navbtn:hover{background:var(--panel2);color:var(--accent)}.navicon{width:24px;text-align:center;font-size:18px}.drawerfoot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.modalback{position:fixed;inset:0;background:#0c0b19a6;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}.modalback.show{display:flex}.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 25px 80px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.modalhead h2{font-size:20px;margin:0}.cropbox{height:240px;border-radius:14px;background:#171622;overflow:hidden;position:relative;touch-action:pan-y}.cropbox img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;transform-origin:center}.cropguide{position:absolute;inset:0;border:2px solid #ffffffaa;pointer-events:none;box-shadow:inset 0 0 0 999px #0002}.cropguide:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #ffffff55}.cropguide:before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px solid #ffffff55}
.note{font-size:12px;color:var(--muted);margin-top:8px}.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.switch{appearance:none;width:45px;height:26px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0}.switch:checked{background:var(--accent)}.switch:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:white;transition:left .18s}.switch:checked:after{left:22px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:100;background:#242238;color:#fff;border-radius:12px;padding:11px 16px;box-shadow:0 8px 30px #0003;font-size:13px;transition:.2s;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}
@media(max-width:760px){.shell{padding:17px 12px 40px}.topbar{padding:0 12px;height:62px}.datepill{display:none}.grid{gap:11px}.span8,.span7,.span6,.span5,.span4{grid-column:span 12}.card{padding:15px;border-radius:17px}.profile{padding:0}.banner{height:125px}.profilebody{padding:0 14px 16px}.avatar{width:80px;height:80px;margin-top:-40px}.profilename{font-size:22px}.profileline{gap:10px;align-items:center}.editprofile{margin-top:13px;padding:8px 10px}.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.pagehead{align-items:flex-start}.pagehead .btn{white-space:nowrap}.eventtime{width:80px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.pagehead h1{font-size:27px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Buka menu">☰</button>
  <div class="brand"><div class="brandmark">D</div><span>Ruang DKV</span></div>
  <div class="topspacer"></div><div class="datepill" id="todayLabel"></div>
  <button class="iconbtn" id="themeQuick" aria-label="Ganti tema" title="Ganti tema">☼</button>
</header>
<main class="shell" id="main"></main>
</div>
<div class="menuoverlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Navigasi">
  <div class="drawerhead"><div class="brand"><div class="brandmark">D</div><span>Ruang DKV</span></div><button class="iconbtn" id="closeMenu">×</button></div>
  <button class="navbtn active" data-page="home"><span class="navicon">⌂</span>Beranda</button>
  <button class="navbtn" data-page="schedule"><span class="navicon">▦</span>Jadwal</button>
  <button class="navbtn" data-page="tasks"><span class="navicon">☑</span>Tugas</button>
  <button class="navbtn" data-page="journal"><span class="navicon">▤</span>Jurnal Pembelajaran</button>
  <button class="navbtn" data-page="ideas"><span class="navicon">✧</span>Ide</button>
  <div class="drawerfoot"><button class="navbtn" data-page="settings"><span class="navicon">⚙</span>Pengaturan</button><div class="note">Data disimpan di perangkat ini. Tidak perlu akun.</div></div>
</aside>
<div class="modalback" id="modalback"><section class="modal" id="modal"></section></div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const DB_NAME='ruang-dkv-db', STORE='records', STATE_KEY='appState';
let db, currentPage='home', selectedDay=dayName(new Date()), editRecordId=null, cropTarget='avatar', cropImage=null, cropScale=1, cropX=0,cropY=0,cropDragging=false,cropStart=null;
const courses=[
 {day:'Senin',name:'Creative Thinking',start:'09:30',end:'12:00'},
 {day:'Senin',name:'Sound Design',start:'13:00',end:'15:30'},
 {day:'Selasa',name:'Sinematografi',start:'09:00',end:'12:00'},
 {day:'Selasa',name:'Animasi 2D',start:'13:00',end:'16:20'},
 {day:'Rabu',name:'Fotografi Komersial',start:'08:40',end:'11:10'},
 {day:'Rabu',name:'Tipografi',start:'13:00',end:'15:30'},
 {day:'Kamis',name:'Storyboard',start:'13:00',end:'15:30'}
];
const days=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const defaultState={profile:{name:'Anonim',bio:'Mahasiswa Desain Komunikasi Visual',avatar:'',banner:''},theme:'light',customSchedules:[],tasks:[],journals:[],ideas:[],references:[],books:[]};
let state=loadState();
function loadState(){try{return {...structuredClone(defaultState),...JSON.parse(localStorage.getItem(STATE_KEY)||'{}'),profile:{...defaultState.profile,...(JSON.parse(localStorage.getItem(STATE_KEY)||'{}').profile||{})}}}catch(e){return structuredClone(defaultState)}}
function openStateDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){resolve(null);return}let req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function saveState(){try{localStorage.setItem(STATE_KEY,JSON.stringify(state))}catch(e){/* IndexedDB below supports larger local attachments. */}if(db){try{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,STATE_KEY);tx.onerror=()=>toast('Gagal menyimpan. Coba ekspor cadangan dan kurangi ukuran lampiran.')}catch(e){toast('Penyimpanan lokal bermasalah. Ekspor cadangan jika memungkinkan.')}}}
async function initPersistence(){try{db=await openStateDB();if(db){let saved=await new Promise((resolve,reject)=>{let req=db.transaction(STORE,'readonly').objectStore(STORE).get(STATE_KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(saved&&typeof saved==='object'){state={...structuredClone(defaultState),...saved,profile:{...defaultState.profile,...(saved.profile||{})}}}}}catch(e){db=null}render()}
function dayName(d){return ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][d.getDay()]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(d=new Date()){return d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function fmtTime(t){return t||'--:--'}
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2700)}
function applyTheme(){document.body.classList.toggle('dark',state.theme==='dark');$('#themeQuick').textContent=state.theme==='dark'?'☾':'☼';$('#themeQuick').title=state.theme==='dark'?'Gunakan tema cerah':'Gunakan tema gelap'}
function openMenu(){$('#drawer').classList.add('show');$('#overlay').classList.add('show')}
function closeMenu(){$('#drawer').classList.remove('show');$('#overlay').classList.remove('show')}
function navigate(page){currentPage=page;closeMenu();render();$$('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function modal(content){$('#modal').innerHTML=content;$('#modalback').classList.add('show')}
function closeModal(){$('#modalback').classList.remove('show');$('#modal').innerHTML='';editRecordId=null}
function empty(msg){return `<div class="empty">${esc(msg)}</div>`}
function titleBlock(eyebrow,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function cardStats(){let done=state.tasks.filter(x=>x.done).length;return `<div class="statgrid">
<div class="stat"><div class="staticon">☑</div><div class="statnum">${state.tasks.length}</div><div class="statlabel">Total tugas</div></div>
<div class="stat"><div class="staticon">✓</div><div class="statnum">${done}</div><div class="statlabel">Tugas selesai</div></div>
<div class="stat"><div class="staticon">▤</div><div class="statnum">${state.journals.length}</div><div class="statlabel">Jurnal belajar</div></div>
<div class="stat"><div class="staticon">✧</div><div class="statnum">${state.ideas.length}</div><div class="statlabel">Ide tersimpan</div></div></div>`}
function avatarFallback(){return `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><defs><linearGradient id="g"><stop stop-color="#6d5dfc"/><stop offset="1" stop-color="#b8aaff"/></linearGradient></defs><rect width="200" height="200" rx="100" fill="url(#g)"/><circle cx="100" cy="75" r="36" fill="#fff" opacity=".92"/><path d="M30 190c5-48 34-70 70-70s65 22 70 70" fill="#fff" opacity=".92"/></svg>`}
function profileCard(){let avatar=state.profile.avatar||'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(avatarFallback());let banner=state.profile.banner?`style="background-image:url('${state.profile.banner}')"`:'';return `<section class="card profile span12"><div class="banner" ${banner}></div><div class="profilebody"><div class="profileline"><img class="avatar" src="${avatar}" alt="Foto profil"><div class="profiletext"><div class="profilename">${esc(state.profile.name||'Anonim')}</div><div class="profilebio">${esc(state.profile.bio||'Mahasiswa Desain Komunikasi Visual')}</div></div><button class="btn secondary editprofile" data-action="edit-profile">✎ Edit profil</button></div></div></section>`}
function sortedSchedule(day){return [...courses.filter(x=>x.day===day).map(x=>({...x,fixed:true})),...state.customSchedules.filter(x=>x.day===day).map(x=>({...x,fixed:false}))].sort((a,b)=>a.start.localeCompare(b.start))}
function eventHTML(e){return `<div class="event"><div class="eventtime">${fmtTime(e.start)}<br>↓<br>${fmtTime(e.end)}</div><div class="eventbody"><div class="eventname">${esc(e.name)}</div><div class="eventtag">${e.fixed?'Jadwal Matkul':'Jadwal custom'}${e.note?' · '+esc(e.note):''}</div>${!e.fixed?`<div class="itemactions"><button class="btn secondary small" data-action="edit-schedule" data-id="${e.id}">Edit</button><button class="btn secondary small" data-action="delete-schedule" data-id="${e.id}">Hapus</button></div>`:''}</div></div>`}
function homePage(){let today=dayName(new Date()),ev=sortedSchedule(today);let upcoming=state.tasks.filter(x=>!x.done).slice(0,3);return `${titleBlock('RUANG KREATIFMU',`Halo, ${esc(state.profile.name||'Anonim')}! 👋`,'Satu tempat untuk mengatur kuliah, tugas, dan inspirasi DKV.')}
<div class="grid">${profileCard()}
<section class="card span12"><div class="sectiontitle">Ringkasan aktivitas <span class="chip">SEMESTER INI</span></div>${cardStats()}<div class="progress"><span style="width:${state.tasks.length?Math.round(state.tasks.filter(x=>x.done).length/state.tasks.length*100):0}%"></span></div><div class="note">${state.tasks.length?Math.round(state.tasks.filter(x=>x.done).length/state.tasks.length*100)+'% tugas sudah selesai':'Tambahkan tugas pertamamu untuk mulai melacak progres.'}</div></section>
<section class="card span6"><div class="sectiontitle">Jadwal hari ini <span class="chip">${esc(today.toUpperCase())}</span></div>${ev.length?ev.map(eventHTML).join(''):empty(today==='Jumat'?'Hari ini kosong. Waktunya istirahat atau berkarya!':'Tidak ada kelas terjadwal hari ini.')}<div style="margin-top:13px"><button class="btn secondary small" data-action="goto-schedule">Lihat semua jadwal →</button></div></section>
<section class="card span6"><div class="sectiontitle">Tugas yang perlu dikerjakan <button class="btn secondary small" data-action="new-task">+ Tambah</button></div>${upcoming.length?`<div class="list">${upcoming.map(t=>`<div class="listitem"><span class="dot"></span><div class="listmain"><div class="listtitle">${esc(t.title)}</div><div class="listmeta">${esc(t.course||'Umum')}${t.due?' · Tenggat '+esc(t.due):''}</div></div></div>`).join('')}</div>`:empty('Belum ada tugas aktif. Nikmati ruang kosongmu, atau tambahkan tugas baru.')}<div style="margin-top:13px"><button class="btn secondary small" data-action="goto-tasks">Buka daftar tugas →</button></div></section>
<section class="card span4"><div class="sectiontitle">Jurnal belajar <span>▤</span></div><p class="sub">Catat materi, lampirkan foto papan tulis, PDF, atau file kuliah.</p><button class="btn secondary small" style="margin-top:14px" data-action="new-journal">+ Tulis jurnal</button></section>
<section class="card span4"><div class="sectiontitle">Bank ide <span>✧</span></div><p class="sub">Simpan inspirasi visual, sketsa, gambar, dan file referensi.</p><button class="btn secondary small" style="margin-top:14px" data-action="new-idea">+ Simpan ide</button></section>
<section class="card span4"><div class="sectiontitle">Referensi & buku <span>⌕</span></div><p class="sub">${state.references.length} referensi · ${state.books.length} buku tersimpan sebagai catatan teks.</p><button class="btn secondary small" style="margin-top:14px" data-action="goto-journal">Kelola catatan →</button></section></div>`}
function schedulePage(){return `${titleBlock('ATUR WAKTUMU','Jadwal kuliah','Jadwal matkul tetap dan jadwal custom dalam satu tampilan.',`<button class="btn" data-action="new-schedule">＋ Jadwal custom</button>`)}

function renderTasks(){let q=(window.taskQuery||'').toLowerCase(),f=window.taskFilter||'all';let list=state.tasks.filter(t=>(t.title+' '+t.course+' '+(t.body||'')).toLowerCase().includes(q)&&(f==='all'||(f==='done'?t.done:!t.done)));return list.length?list.map(t=>`<section class="card span6 ${t.done?'completed':''}"><div class="itemtop"><div class="itemtitle">${esc(t.title)}</div><span class="chip">${t.done?'SELESAI':'AKTIF'}</span></div><div class="listmeta">${esc(t.course||'Umum')}${t.due?' · Tenggat '+esc(t.due):''}</div>${t.body?`<div class="itembody">${esc(t.body)}</div>`:''}${attachmentHTML(t.attachments)}<div class="itemactions"><button class="btn small" data-action="toggle-task" data-id="${t.id}">${t.done?'↶ Belum selesai':'✓ Tandai selesai'}</button><button class="btn secondary small" data-action="edit-task" data-id="${t.id}">Edit</button><button class="btn secondary small" data-action="delete-task" data-id="${t.id}">Hapus</button></div></section>`).join(''): `<div class="span12">${empty(q?'Tidak ada tugas yang cocok dengan pencarian.':'Belum ada tugas. Tekan “Tambah tugas” untuk mulai menyimpan pekerjaan kuliah.')}</div>`}

function render(){applyTheme();$('#todayLabel').textContent=fmtDate();const views={home:homePage,schedule:schedulePage,tasks:taskPage,journal:journalPage,ideas:ideasPage,settings:settingsPage};$('#main').innerHTML=(views[currentPage]||homePage)();$$('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));if(currentPage==='tasks'){if($('#taskFilter'))$('#taskFilter').value=window.taskFilter||'all';}}

function recordForm(type,id=''){let bucket=type==='journal'?'journals':'ideas',old=id?state[bucket].find(x=>x.id===id):null;editRecordId=id||null;let title=type==='journal'?'Jurnal pembelajaran':'Ide';modal(`<div class="modalhead"><h2>${old?'Edit':'Tambah'} ${title.toLowerCase()}</h2><button class="iconbtn" data-action="close-modal">×</button></div>
<form id="recordForm" data-type="${type}" data-id="${id}"><div class="field"><label>Judul *</label><input name="title" required maxlength="140" placeholder="${type==='journal'?'Contoh: Catatan tipografi pertemuan 3':'Contoh: Konsep poster kampanye'}" value="${esc(old?.title||'')}"></div><div class="field"><label>Mata kuliah (opsional)</label><select name="course">${courseOptions(old?.course||'')}</select></div><div class="field"><label>Catatan / isi</label><textarea name="body" placeholder="Tulis materi, penjelasan, atau detail idemu…">${esc(old?.body||'')}</textarea></div>${fileField(old?.attachments||[])}<div class="btnrow"><button class="btn" type="submit">Simpan ${type==='journal'?'jurnal':'ide'}</button><button class="btn secondary" type="button" data-action="close-modal">Batal</button></div></form>`);if(old)$('#recordFiles').dataset.keep=JSON.stringify(old.attachments||[])}
function taskForm(id=''){let old=id?state.tasks.find(x=>x.id===id):null;editRecordId=id||null;modal(`<div class="modalhead"><h2>${old?'Edit tugas':'Tambah tugas / proyek'}</h2><button class="iconbtn" data-action="close-modal">×</button></div><form id="taskForm" data-id="${id}"><div class="field"><label>Nama tugas *</label><input name="title" required maxlength="140" placeholder="Contoh: Poster kampanye sosial" value="${esc(old?.title||'')}"></div><div class="formgrid"><div class="field"><label>Mata kuliah *</label><select name="course" required>${courseOptions(old?.course||'')}</select></div><div class="field"><label>Tenggat (opsional)</label><input type="date" name="due" value="${esc(old?.due||'')}"></div></div><div class="field"><label>Deskripsi / catatan</label><textarea name="body" placeholder="Brief, ukuran, format pengumpulan, pembagian tugas…">${esc(old?.body||'')}</textarea></div>${fileField(old?.attachments||[])}<div class="btnrow"><button class="btn" type="submit">Simpan tugas</button><button class="btn secondary" type="button" data-action="close-modal">Batal</button></div></form>`);if(old)$('#recordFiles').dataset.keep=JSON.stringify(old.attachments||[])}
function scheduleForm(id=''){let old=id?state.customSchedules.find(x=>x.id===id):null;modal(`<div class="modalhead"><h2>${old?'Edit':'Tambah'} jadwal custom</h2><button class="iconbtn" data-action="close-modal">×</button></div><form id="scheduleForm" data-id="${id}"><div class="field"><label>Nama kegiatan *</label><input name="name" required maxlength="120" placeholder="Contoh: Diskusi kelompok" value="${esc(old?.name||'')}"></div><div class="field"><label>Hari *</label><select name="day" required>${days.map(d=>`<option ${d===(old?.day||selectedDay)?'selected':''}>${d}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Jam mulai *</label><input name="start" type="time" required value="${esc(old?.start||'09:00')}"></div><div class="field"><label>Jam selesai *</label><input name="end" type="time" required value="${esc(old?.end||'10:00')}"></div></div><div class="field"><label>Catatan (opsional)</label><input name="note" maxlength="180" placeholder="Lokasi, deadline, pengingat…" value="${esc(old?.note||'')}"></div><div class="btnrow"><button class="btn" type="submit">Simpan jadwal</button><button class="btn secondary" type="button" data-action="close-modal">Batal</button></div></form>`)}
function textForm(type,id=''){let bucket=type==='reference'?'references':'books',old=id?state[bucket].find(x=>x.id===id):null;let isRef=type==='reference';modal(`<div class="modalhead"><h2>${old?'Edit':'Tambah'} ${isRef?'referensi':'buku pembelajaran'}</h2><button class="iconbtn" data-action="close-modal">×</button></div><form id="textForm" data-type="${type}" data-id="${id}"><div class="field"><label>${isRef?'Judul referensi':'Judul buku'} *</label><input name="title" required maxlength="140" value="${esc(old?.title||'')}" placeholder="${isRef?'Nama artikel / tautan / sumber':'Judul buku' }"></div><div class="field"><label>${isRef?'Tautan atau catatan referensi':'Penulis, bab, halaman, atau ringkasan'}</label><textarea name="body" placeholder="${isRef?'Tempel tautan dan tulis kenapa referensi ini berguna…':'Catat penulis, halaman, poin penting, dan kutipan…'}">${esc(old?.body||'')}</textarea></div><div class="btnrow"><button class="btn" type="submit">Simpan</button><button class="btn secondary" type="button" data-action="close-modal">Batal</button></div></form>`)}
function profileForm(){let p=state.profile;modal(`<div class="modalhead"><h2>Edit profil</h2><button class="iconbtn" data-action="close-modal">×</button></div><form id="profileForm"><div class="field"><label>Nama tampilan</label><input name="name" maxlength="50" value="${esc(p.name)}" placeholder="Anonim"></div><div class="field"><label>Bio singkat</label><input name="bio" maxlength="100" value="${esc(p.bio)}" placeholder="Mahasiswa DKV"></div><div class="formgrid"><div class="field"><label>Foto profil dari galeri</label><input type="file" id="avatarPick" accept="image/*"><button class="btn secondary small" type="button" data-action="crop-avatar">✂ Crop foto profil</button></div><div class="field"><label>Banner dari galeri</label><input type="file" id="bannerPick" accept="image/*"><button class="btn secondary small" type="button" data-action="crop-banner">✂ Crop banner</button></div></div><div class="note">Pilih foto dulu, lalu tekan tombol crop untuk mengatur posisi dan zoom seperti editor profil.</div><div class="btnrow" style="margin-top:16px"><button class="btn" type="submit">Simpan profil</button><button class="btn secondary" type="button" data-action="close-modal">Batal</button></div></form>`)}
function openCrop(target){let input=target==='avatar'?$('#avatarPick'):$('#bannerPick');if(!input?.files?.[0]){toast('Pilih gambar dari galeri dulu.');return}let f=input.files[0];if(!f.type.startsWith('image/')){toast('Pilih file gambar.');return}let reader=new FileReader();reader.onload=()=>{cropTarget=target;cropImage=new Image();cropImage.onload=()=>{cropScale=1;cropX=0;cropY=0;showCropModal()};cropImage.src=reader.result};reader.readAsDataURL(f)}
function showCropModal(){modal(`<div class="modalhead"><h2>Atur ${cropTarget==='avatar'?'foto profil':'banner'}</h2><button class="iconbtn" data-action="close-modal">×</button></div><div class="cropbox" id="cropbox"><img id="cropPreview" src="${cropImage.src}" alt="Pratinjau crop"><div class="cropguide"></div></div><div class="field" style="margin-top:15px"><label>Zoom</label><input id="cropZoom" type="range" min="1" max="3" step=".01" value="1"></div><div class="note">Geser gambar untuk mengatur posisi. Bagian di dalam bingkai yang akan disimpan.</div><div class="btnrow" style="margin-top:15px"><button class="btn" data-action="apply-crop">Gunakan gambar</button><button class="btn secondary" data-action="close-modal">Batal</button></div>`);let box=$('#cropbox');box.style.height=cropTarget==='avatar'?'240px':'190px';let img=$('#cropPreview');img.onload=fitCrop;fitCrop();$('#cropZoom').addEventListener('input',e=>{cropScale=+e.target.value;fitCrop()});box.addEventListener('pointerdown',e=>{cropDragging=true;cropStart={x:e.clientX,y:e.clientY,ox:cropX,oy:cropY};box.setPointerCapture(e.pointerId)});box.addEventListener('pointermove',e=>{if(!cropDragging)return;cropX=cropStart.ox+e.clientX-cropStart.x;cropY=cropStart.oy+e.clientY-cropStart.y;fitCrop()});box.addEventListener('pointerup',()=>cropDragging=false);box.addEventListener('pointercancel',()=>cropDragging=false)}
function fitCrop(){let box=$('#cropbox'),img=$('#cropPreview');if(!box||!img||!cropImage)return;let w=box.clientWidth,h=box.clientHeight,base=Math.max(w/cropImage.width,h/cropImage.height),iw=cropImage.width*base*cropScale,ih=cropImage.height*base*cropScale;img.style.width=iw+'px';img.style.height=ih+'px';img.style.left=((w-iw)/2+cropX)+'px';img.style.top=((h-ih)/2+cropY)+'px'}
function applyCrop(){let box=$('#cropbox');if(!box||!cropImage)return;let w=box.clientWidth,h=box.clientHeight,base=Math.max(w/cropImage.width,h/cropImage.height),iw=cropImage.width*base*cropScale,ih=cropImage.height*base*cropScale,left=(w-iw)/2+cropX,top=(h-ih)/2+cropY;let scale=cropImage.width/iw;let sx=Math.max(0,-left*scale),sy=Math.max(0,-top*scale),sw=Math.min(cropImage.width,w*scale),sh=Math.min(cropImage.height,h*scale);let canvas=document.createElement('canvas');canvas.width=cropTarget==='avatar'?600:1200;canvas.height=cropTarget==='avatar'?600:Math.round(1200*h/w);let ctx=canvas.getContext('2d');ctx.drawImage(cropImage,sx,sy,sw,sh,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.88);if(cropTarget==='avatar')state.profile.avatar=data;else state.profile.banner=data;saveState();closeModal();profileForm();toast('Crop diterapkan. Tekan Simpan profil untuk menyimpan perubahan.')}
async function readFiles(input){let files=[...(input?.files||[])];let out=[];for(let f of files){if(f.size>8*1024*1024){toast(`${f.name} lebih dari 8 MB, dilewati.`);continue}try{let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});out.push({name:f.name,type:f.type||'application/octet-stream',size:f.size,data})}catch(e){}}return out}
async function getAttachments(){let input=$('#recordFiles'),keep=[];try{keep=JSON.parse(input?.dataset.keep||'[]')}catch(e){}let newFiles=await readFiles(input);return [...keep,...newFiles]}
function removeAttachment(index){let input=$('#recordFiles');if(!input)return;let arr=[];try{arr=JSON.parse(input.dataset.keep||'[]')}catch(e){}arr.splice(index,1);input.dataset.keep=JSON.stringify(arr);let existing=$('#existingFiles');if(existing)existing.innerHTML=arr.map((a,i)=>`<span class="attachment">${esc(a.name)} <button type="button" class="iconbtn" style="width:22px;height:22px;font-size:15px" data-action="remove-attachment" data-index="${i}">×</button></span>`).join('')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cadangan-ruang-dkv-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('Cadangan mulai diunduh.')}

$('#menuBtn').addEventListener('click',openMenu);$('#closeMenu').addEventListener('click',closeMenu);$('#overlay').addEventListener('click',closeMenu);$('#themeQuick').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';saveState();render()});

document.addEventListener('change',e=>{if(e.target.id==='taskFilter'){window.taskFilter=e.target.value;let list=$('#taskList');if(list)list.innerHTML=renderTasks()}if(e.target.id==='themeSwitch'){state.theme=e.target.checked?'dark':'light';saveState();render()}if(e.target.id==='importFile'&&e.target.files[0]){let r=new FileReader();r.onload=()=>{try{let incoming=JSON.parse(r.result);if(!incoming.profile||!Array.isArray(incoming.tasks))throw Error();state={...structuredClone(defaultState),...incoming,profile:{...defaultState.profile,...incoming.profile}};saveState();render();toast('Cadangan berhasil diimpor.')}catch(err){toast('File cadangan tidak valid.')}};r.readAsText(e.target.files[0]);e.target.value=''}});
document.addEventListener('submit',async e=>{let f=e.target;if(!['taskForm','recordForm','scheduleForm','textForm','profileForm'].includes(f.id))return;e.preventDefault();let fd=new FormData(f),id=f.dataset.id||'',now=new Date().toLocaleDateString('id-ID');if(f.id==='profileForm'){state.profile.name=(fd.get('name')||'').trim()||'Anonim';state.profile.bio=(fd.get('bio')||'').trim();saveState();closeModal();render();toast('Profil disimpan.');return}
if(f.id==='taskForm'){let attachments=await getAttachments(),old=state.tasks.find(x=>x.id===id);let obj={id:id||uid(),title:fd.get('title').trim(),course:fd.get('course'),due:fd.get('due'),body:fd.get('body').trim(),attachments,done:old?.done||false};if(old)state.tasks=state.tasks.map(x=>x.id===id?obj:x);else state.tasks.unshift(obj);saveState();closeModal();render();toast('Tugas disimpan.');return}
if(f.id==='recordForm'){let type=f.dataset.type,bucket=type==='journal'?'journals':'ideas',attachments=await getAttachments(),old=state[bucket].find(x=>x.id===id),obj={id:id||uid(),title:fd.get('title').trim(),course:fd.get('course'),body:fd.get('body').trim(),attachments,date:old?.date||now};if(old)state[bucket]=state[bucket].map(x=>x.id===id?obj:x);else state[bucket].unshift(obj);saveState();closeModal();render();toast('Catatan disimpan.');return}
if(f.id==='scheduleForm'){let obj={id:id||uid(),name:fd.get('name').trim(),day:fd.get('day'),start:fd.get('start'),end:fd.get('end'),note:fd.get('note').trim()};if(obj.end<=obj.start){toast('Jam selesai harus setelah jam mulai.');return}if(id)state.customSchedules=state.customSchedules.map(x=>x.id===id?obj:x);else state.customSchedules.push(obj);selectedDay=obj.day;saveState();closeModal();render();toast('Jadwal custom disimpan.');return}
if(f.id==='textForm'){let type=f.dataset.type,bucket=type==='reference'?'references':'books',old=state[bucket].find(x=>x.id===id),obj={id:id||uid(),title:fd.get('title').trim(),body:fd.get('body').trim()};if(old)state[bucket]=state[bucket].map(x=>x.id===id?obj:x);else state[bucket].unshift(obj);saveState();closeModal();render();toast('Catatan disimpan.');return}
});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;
switch(a){
case 'close-modal':closeModal();break;case 'edit-profile':profileForm();break;case 'new-task':taskForm();break;case 'edit-task':taskForm(id);break;case 'toggle-task':{let t=state.tasks.find(x=>x.id===id);if(t)t.done=!t.done;saveState();render();break}case 'delete-task':deleteRecord('tasks',id);break;
case 'new-journal':recordForm('journal');break;case 'edit-journal':recordForm('journal',id);break;case 'delete-journal':deleteRecord('journals',id);break;case 'new-idea':recordForm('idea');break;case 'edit-idea':recordForm('idea',id);break;case 'delete-idea':deleteRecord('ideas',id);break;
case 'new-reference':textForm('reference');break;case 'edit-reference':textForm('reference',id);break;case 'delete-reference':deleteRecord('references',id);break;case 'new-book':textForm('book');break;case 'edit-book':textForm('book',id);break;case 'delete-book':deleteRecord('books',id);break;
case 'new-schedule':scheduleForm();break;case 'edit-schedule':scheduleForm(id);break;case 'delete-schedule':deleteRecord('customSchedules',id);break;case 'select-day':selectedDay=b.dataset.day;render();break;
case 'goto-schedule':navigate('schedule');break;case 'goto-tasks':navigate('tasks');break;case 'goto-journal':navigate('journal');break;case 'new-journal':recordForm('journal');break;
case 'crop-avatar':openCrop('avatar');break;case 'crop-banner':openCrop('banner');break;case 'apply-crop':applyCrop();break;
case 'remove-attachment':removeAttachment(+b.dataset.index);break;case 'export-data':exportData();break;case 'import-data':importData();break;case 'clear-data':clearData();break;case 'confirm-clear':confirmClear();break;
}
});
/* Profile crop selections are previewed and retained until Save profile. */
const originalProfileForm=profileForm;
profileForm=function(){originalProfileForm();let form=$('#profileForm');if(form){form.dataset.profileDraft='1';}};
/* Prevent accidental losing of selected profile images before saving. */
document.addEventListener('change',e=>{if(e.target.id==='avatarPick'||e.target.id==='bannerPick'){if(e.target.files[0])toast('Gambar dipilih. Tekan tombol crop untuk mengatur tampilannya.')}});
/* Reopen profile form after applying crop, preserving typed fields. */
const oldApplyCrop=applyCrop;
applyCrop=function(){let name=$('#profileForm [name="name"]')?.value,bio=$('#profileForm [name="bio"]')?.value;oldApplyCrop();if($('#profileForm')){$('#profileForm [name="name"]').value=name||state.profile.name;$('#profileForm [name="bio"]').value=bio||state.profile.bio;}};
initPersistence();
})();
</script>
</body>
</html>
